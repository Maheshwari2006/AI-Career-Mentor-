{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card shadow p-4">

<h2>
Upload Resume
</h2>

<hr>

<form method="POST"
      enctype="multipart/form-data">

<div class="mb-3">

<input type="file"
       name="resume"
       class="form-control"
       accept=".pdf"
       required>

</div>

<button class="btn btn-primary">

Upload Resume

</button>

</form>

</div>

</div>

</div>

{% endblock %}
